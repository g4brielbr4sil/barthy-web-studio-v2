<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#F6FAFD" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Página não encontrada | Barthy Web Studio</title>
    <!--
      Cloudflare Pages only answers unknown paths with a real 404 when a
      top-level 404.html exists; without it every path fell back to
      index.html with status 200 (soft 404), which also made Lighthouse's
      agentic audit read the landing page HTML as /.well-known/ai-catalog.json.
    -->
    <style>
      :root {
        color-scheme: light;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
        padding: 1.5rem;
        background: #f6fafd;
        color: #0a1931;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.5;
      }

      main {
        max-width: 32rem;
      }

      p:first-child {
        margin: 0 0 0.75rem;
        color: #a85641;
        font-size: 0.78rem;
        font-weight: 760;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(1.8rem, 6vw, 2.6rem);
        font-weight: 520;
        letter-spacing: -0.04em;
        line-height: 1.05;
      }

      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        padding-inline: 1.25rem;
        border-radius: 999px;
        background: #0a1931;
        color: #f6fafd;
        font-weight: 650;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #cd765d;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Barthy Web Studio</p>
      <h1>Página não encontrada</h1>
      <a href="/">Voltar para a página inicial</a>
    </main>
  </body>
</html>
